    <meta charset="UTF-8" />

    <meta name="description" content="Sistem absensi QR code modern dengan notifikasi WhatsApp Fonnte otomatis dan generator cetak kartu pelajar standar ISO/IEC 7810 ID-1 untuk SMKS PGRI 1 Sukabumi." />

    <meta property="og:description" content="Sistem absensi QR code modern dengan notifikasi WhatsApp Fonnte otomatis dan generator cetak kartu pelajar standar ISO/IEC 7810 ID-1 untuk SMKS PGRI 1 Sukabumi." />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      // Pre-initialize theme to prevent flash of wrong theme
      try {
        var savedTheme = localStorage.getItem('school_presensi_theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}

      // Ensure window.fetch is safely configurable and writable for Chrome extensions & devtools
      try {
        var _currentFetch = window.fetch ? window.fetch.bind(window) : null;
        Object.defineProperty(window, 'fetch', {
          get: function() { return _currentFetch; },
          set: function(val) { _currentFetch = val; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // Safe fallback
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
